<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPTX + IA</title>
<style>
  :root { --bg:#f6f6f9; --card:#fff; --ink:#1e1e24; --mute:#6b6b78; --line:#e3e3ea; --acc:#6965db; --accbg:#f1f0ff; --err:#c92a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17171b; --card:#212126; --ink:#ececf1; --mute:#9d9daa; --line:#34343c; --acc:#8f8cff; --accbg:#2a2945; --err:#ff8a8a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--mute); margin:0 0 18px; font-size:13px; }
  .drop { border:2px dashed var(--line); border-radius:14px; background:var(--card); padding:34px 16px; text-align:center; cursor:pointer; transition:.15s; }
  .drop.over, .drop:hover { border-color:var(--acc); background:var(--accbg); }
  .drop b { display:block; font-size:16px; margin-bottom:4px; } .drop span { color:var(--mute); font-size:13px; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:flex-end; }
  textarea { flex:1; min-width:240px; resize:vertical; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  button.go { height:40px; padding:0 20px; border:0; border-radius:10px; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:default; }
  label.chk { font-size:13px; color:var(--mute); display:flex; gap:6px; align-items:center; }
  .file { margin-top:12px; font-size:13px; color:var(--mute); }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:20px; align-items:start; }
  @media (max-width:820px) { .cols { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .ans { white-space:pre-wrap; }
  .meta { color:var(--mute); font-size:12px; margin-top:12px; }
  .err { color:var(--err); }
  .slide { border-top:1px solid var(--line); padding:10px 0; } .slide:first-of-type { border-top:0; padding-top:0; }
  .slide h3 { margin:0 0 4px; font-size:13px; color:var(--acc); }
  .slide p { margin:2px 0; font-size:13px; } .slide .k { color:var(--mute); }
  .imgs { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .imgs img { max-width:100%; max-height:170px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:r .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>PPTX + IA</h1>
  <p class="sub">Solte um PowerPoint. O servidor extrai texto, notas, dados de gráficos e imagens de cada slide, manda para <b id="model">…</b> e mostra a resposta ao lado do que foi extraído.</p>

  <div class="drop" id="drop" tabindex="0">
    <b>Solte o arquivo .pptx aqui</b>
    <span>ou clique para escolher · até 60 MB · o arquivo só passa pelo seu computador e pela API da OpenAI</span>
    <input type="file" id="file" accept=".pptx" hidden>
  </div>
  <div class="file" id="fileinfo"></div>

  <div class="row">
    <textarea id="q" rows="2">Descreva cada slide. Para os que têm imagem, diga o que a imagem mostra, com os números e textos que aparecem nela.</textarea>
    <label class="chk"><input type="checkbox" id="imgs" checked> enviar as imagens</label>
    <button class="go" id="go" disabled>Analisar</button>
  </div>

  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id)
let file = null
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))

fetch('/status').then((r) => r.json()).then((s) => { $('model').textContent = s.model ?? 'o modelo'; if (!s.ok) $('out').innerHTML = '<p class="err">O servidor não achou a chave da OpenAI.</p>' })

function pick(f) {
  if (!f) return
  if (!/\.pptx$/i.test(f.name)) { $('fileinfo').innerHTML = '<span class="err">Use um arquivo .pptx (PowerPoint novo; .ppt antigo não funciona).</span>'; return }
  file = f
  $('fileinfo').textContent = `${f.name} · ${(f.size / 1024 / 1024).toFixed(2)} MB`
  $('go').disabled = false
}
$('drop').onclick = () => $('file').click()
$('file').onchange = (e) => { pick(e.target.files[0]); e.target.value = '' }
;['dragenter', 'dragover'].forEach((t) => $('drop').addEventListener(t, (e) => { e.preventDefault(); $('drop').classList.add('over') }))
;['dragleave', 'drop'].forEach((t) => $('drop').addEventListener(t, (e) => { e.preventDefault(); $('drop').classList.remove('over') }))
$('drop').addEventListener('drop', (e) => pick(e.dataTransfer.files[0]))
window.addEventListener('dragover', (e) => e.preventDefault())
window.addEventListener('drop', (e) => e.preventDefault())

$('go').onclick = async () => {
  if (!file) return
  $('go').disabled = true
  $('out').innerHTML = '<p><span class="spin"></span>Extraindo os slides e perguntando à IA… pode levar até um minuto.</p>'
  try {
    const r = await fetch('/analyze', { method: 'POST', headers: { 'x-question': encodeURIComponent($('q').value), 'x-images': $('imgs').checked ? '1' : '0' }, body: file })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || `Erro ${r.status}`)
    const nImg = d.slides.reduce((n, s) => n + s.images.length, 0)
    $('out').innerHTML = `<div class="cols">
      <div class="card"><h2>O que a IA respondeu</h2><div class="ans">${esc(d.text)}</div>
        ${d.dropped.length ? `<p class="err">A API recusou estas imagens e elas ficaram de fora: ${esc(d.dropped.join('; '))}</p>` : ''}<div class="meta">${esc(d.model)} · ${d.seconds}s · ${d.tokens.entrada ?? '?'} tokens de entrada, ${d.tokens.saida ?? '?'} de saída · ${d.sentImages ? nImg + ' imagens enviadas' : 'imagens NÃO enviadas'}</div></div>
      <div class="card"><h2>O que foi extraído (${d.slides.length} slides)</h2>${d.slides.map((s) => `<div class="slide"><h3>Slide ${s.n}</h3>
        ${s.text.length ? `<p><span class="k">Texto:</span> ${esc(s.text.join(' | '))}</p>` : '<p class="k">Sem texto.</p>'}
        ${s.notes.filter((n) => !/^\d+$/.test(n)).length ? `<p><span class="k">Notas:</span> ${esc(s.notes.filter((n) => !/^\d+$/.test(n)).join(' '))}</p>` : ''}
        ${s.charts.map((c) => `<p><span class="k">Gráfico nativo:</span> ${esc(JSON.stringify(c))}</p>`).join('')}
        ${s.skipped.length ? `<p class="err">Imagens puladas: ${esc(s.skipped.join(', '))}</p>` : ''}
        ${s.images.some((i) => i.repaired) ? '<p class="err">Imagem cortada no próprio arquivo (PNG truncado): recuperei o que dava; o final pode estar faltando.</p>' : ''}
        ${s.images.length ? `<div class="imgs">${s.images.map((i) => `<img src="${i.src}" alt="${esc(i.name)}" title="${esc(i.name)} · ${i.kb} KB">`).join('')}</div>` : ''}</div>`).join('')}</div>
    </div>`
  } catch (e) {
    $('out').innerHTML = `<p class="err">${esc(e.message)}</p>`
  } finally {
    $('go').disabled = false
  }
}
</script>
</body>
</html>
